[package]
name = "xmip-core-transport-mariadb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-mariadb"
description = "MariaDB transport: one row of a query is one Stream, a send is one INSERT; the client/server protocol of xmip-core-library-mariadb with MariaDB's native password, over the estate's TLS where asked. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md); with its TLS under the default feature, for the
# one reading of `tls` and `tls_name` (`transport::sql::client_tls`). Its
# declaration takes what every SQL Location declares (`transport::sql`),
# which needs no TLS.
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The protocol, both halves, and the native password this crate logs in
# with; the far end the tests and the System Tests serve.
mariadb = { workspace = true, optional = true }
# SQL: the MariaDB dialect this server speaks — its literals, its binary
# form, the INSERT a send writes — in the mode the session reads.
sql = { workspace = true, optional = true }
# What a login checks the server by under TLS (`tls::ClientSettings`).
tls = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "transport/tls", "dep:mariadb", "dep:sql", "dep:tls"]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# The Unicode form a text column's test declares.
codec = { workspace = true }

[lints]
workspace = true
